<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pool Tracker</title>
  <meta name="description" content="Lap times, stroke rate and stroke count for every lane, from one camera watching the pool.">
  <meta name="theme-color" content="#2a78d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="pool.css">
</head>
<body>
  <header class="topbar">
    <h1>Pool Tracker</h1>
  </header>

  <main>
    <div id="home"></div>

    <div id="work" class="work" hidden>
      <div class="stage-col">
        <div class="stage" id="stage">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>
      </div>
      <div class="panel" id="panel"></div>
    </div>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
