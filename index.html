<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jump Height</title>
  <meta name="description" content="Estimate your vertical jump from flight time, using a phone camera.">
  <meta name="theme-color" content="#2a78d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <h1>Jump Height</h1>
  </header>

  <main>
    <div id="home"></div>

    <div id="live" class="live" hidden>
      <div class="stage-col">
        <div class="stage" id="stage">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="lanes" id="lanes"></div>
          <div class="loading" id="loading" hidden>
            <div class="spinner" aria-hidden="true"></div>
            <p><b>Loading the pose model…</b></p>
            <p class="small">The first load downloads about 15 MB.</p>
          </div>
        </div>
      </div>
      <div class="panel" id="panel"></div>
    </div>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
