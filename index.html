<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jump Height</title>
  <meta name="description" content="Estimate your vertical jump from flight time, using a phone camera.">
  <meta name="theme-color" content="#2a78d6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <h1>Jump Height</h1>
  </header>

  <main>
    <div id="home"></div>

    <div id="live" class="live" hidden>
      <div class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="lanes" id="lanes"></div>
        <div class="loading" id="loading" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p><b id="loading-title">Starting the pose model…</b></p>
          <p class="small" id="loading-note"></p>
        </div>
      </div>
      <div class="hud" id="hud">
        <div class="hud-status" id="status" role="status" aria-live="polite" hidden></div>
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Settings and results" aria-controls="panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="hud-pills">
          <p class="hud-pill error" id="live-error" role="alert" hidden></p>
          <p class="hud-pill" id="tilt-hint" hidden></p>
          <p class="hud-pill" id="turn" hidden>Turn the phone sideways so each athlete gets a wider section.</p>
          <p class="hud-pill" id="fps-warn" hidden></p>
        </div>
      </div>
      <div class="scrim" id="scrim" hidden></div>
      <aside class="panel" id="panel" aria-label="Settings and results" inert></aside>
    </div>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
