name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" button: republish without a code change

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Publishes the app to GitHub Pages from main so it can be opened on a phone
  # or tablet. Enable it once under Settings → Pages → Source: "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html pool.css sw.js manifest.webmanifest icon.svg src _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
